<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Info Exporter</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1c1c1c;
        --muted: #6b6b6b;
        --border: #d8d8d8;
        --accent: #0a84ff;
        --accent-fg: #ffffff;
        --field-bg: #f5f5f5;
        --radius: 8px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --fg: #f2f2f2;
          --muted: #a0a0a0;
          --border: #3a3a3a;
          --accent: #0a84ff;
          --accent-fg: #ffffff;
          --field-bg: #2a2a2a;
        }
      }
       * { box-sizing: border-box; }
       html, body { margin: 0; padding: 0; width: 520px; overflow: hidden; }
       body {
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         font-size: 13px;
         color: var(--fg);
         background: var(--bg);
         padding: 12px;
       }
       h1 {
         font-size: 14px;
         margin: 0 0 8px;
       }
       #count {
         color: var(--muted);
         margin-bottom: 10px;
       }
       label { display: block; }
       select, fieldset { margin-bottom: 10px; }
       select {
         width: 100%;
         padding: 6px 8px;
         border: 1px solid var(--border);
         border-radius: var(--radius);
         background: var(--field-bg);
         color: var(--fg);
         font: inherit;
       }
       fieldset {
         border: 1px solid var(--border);
         border-radius: var(--radius);
         padding: 8px 10px;
       }
       legend { padding: 0 4px; color: var(--muted); }
       .field-grid {
         display: grid;
         grid-template-columns: 1fr 1fr;
         gap: 4px 10px;
       }
       .field {
         display: flex;
         align-items: center;
         gap: 6px;
         padding: 2px 0;
       }
       .format {
         display: flex;
         gap: 14px;
         padding: 2px 0;
       }
       /* Two-column layout: popup does not scroll; only preview scrolls */
       .app {
         display: grid;
         grid-template-columns: 62% 38%;
         gap: 12px;
         overflow: hidden;
         height: fit-content;
         max-height: 95vh;
       }
       .preview-col { display: flex; flex-direction: column; }
       .controls-col { display: flex; flex-direction: column; }
       #preview {
         flex: 1;
         max-height: 60vh;
         overflow-y: auto;
         border: 1px solid var(--border);
         border-radius: var(--radius);
         padding: 8px;
         background: var(--field-bg);
         color: var(--fg);
         font-family: monospace;
         font-size: 12px;
         white-space: pre-wrap;
         word-break: break-word;
         margin-top: 8px;
       }
      /* Bottom action bar spanning both columns */
      .actions-bar {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      button {
        flex: 1;
        min-height: 36px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--field-bg);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
      #status {
        grid-column: 1 / -1;
        min-height: 16px;
        color: var(--muted);
        word-break: break-word;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Tab Info Exporter</h1>
    <div id="count"></div>

     <div class="app">
      <!-- LEFT: Preview column -->
      <div class="preview-col">
        <fieldset>
          <legend id="formatLegend"></legend>
          <div class="format">
             <label class="field"><input type="radio" name="format" value="txt" /> <span id="fmtTxt"></span></label>
             <label class="field"><input type="radio" name="format" value="md" /> <span id="fmtMd"></span></label>
             <label class="field"><input type="radio" name="format" value="csv" checked /> <span id="fmtCsv"></span></label>
             <label class="field"><input type="radio" name="format" value="json" /> <span id="fmtJson"></span></label>
          </div>
        </fieldset>
        <pre id="preview"></pre>
      </div>

      <!-- RIGHT: Controls column -->
      <div class="controls-col">
        <label>
          <span id="langLabelText"></span>
          <select id="lang"></select>
        </label>

        <label>
          <span id="sortLabelText"></span>
          <select id="sort"></select>
        </label>

        <fieldset>
          <legend id="fieldsLegend"></legend>
          <div id="fields" class="field-grid"></div>
        </fieldset>

        <label class="field">
           <input type="checkbox" id="groupByDomain" /> <span id="groupByDomainLabel"></span>
         </label>
       </div>

      <!-- BOTTOM: Full-width action bar -->
      <div class="actions-bar">
        <button id="copy" class="primary"></button>
        <button id="download"></button>
      </div>

      <div id="status"></div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
