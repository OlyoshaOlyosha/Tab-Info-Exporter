<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Info Exporter</title>
        <style>
      :root {
        --bg: #ffffff;
        --fg: #1c1c1c;
        --muted: #6b6b6b;
        --border: #d8d8d8;
        --accent: #0a84ff;
        --accent-fg: #ffffff;
        --field-bg: #f5f5f5;
        --radius: 8px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --gap: 10px;
        --btn-h: 36px;
        --font-size: 13px;
        --font-mono: 12px;
        --popup-w: 700px;
        --popup-h: 550px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --fg: #f2f2f2;
          --muted: #a0a0a0;
          --border: #3a3a3a;
          --accent: #0a84ff;
          --accent-fg: #ffffff;
          --field-bg: #2a2a2a;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: var(--popup-w);
        height: var(--popup-h);
        overflow: hidden;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: var(--font-size);
        color: var(--fg);
        background: var(--bg);
        padding: var(--space-3);
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 var(--space-1);
        flex-shrink: 0;
      }
      #count {
        color: var(--muted);
        margin-bottom: var(--space-2);
        flex-shrink: 0;
        font-size: 12px;
      }
      label { display: block; }
      select, fieldset { margin-bottom: var(--space-2); }
      select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--field-bg);
        color: var(--fg);
        font: inherit;
      }
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      fieldset {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: var(--space-2) var(--space-3);
      }
      legend {
        padding: 0 var(--space-1);
        color: var(--muted);
        font-size: 11px;
      }
      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-1) var(--gap);
      }
      .field {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 0;
      }
      .format {
        display: flex;
        gap: 14px;
        padding: 2px 0;
        flex-wrap: wrap;
      }
      .app {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
        grid-template-rows: 1fr auto auto;
        gap: var(--gap);
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .preview-col {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      .controls-col {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow-y: auto;
      }
      #preview {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: var(--space-2);
        background: var(--field-bg);
        color: var(--fg);
        font-size: var(--font-size);
        word-break: break-word;
        margin-top: var(--space-2);
      }
      #preview.plain {
        font-family: monospace;
        font-size: var(--font-mono);
        white-space: pre-wrap;
      }
      #preview::-webkit-scrollbar {
        width: 6px;
      }
      #preview::-webkit-scrollbar-track {
        background: transparent;
      }
      #preview::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }
      #preview::-webkit-scrollbar-thumb:hover {
        background: var(--muted);
      }
      #preview .md-item {
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
      }
      #preview .md-item:last-child {
        border-bottom: none;
      }
      #preview .md-item a,
      #preview .md-title {
        font-weight: 500;
        color: var(--accent);
        text-decoration: none;
        display: block;
        margin-bottom: 2px;
      }
      #preview .md-item a:hover {
        text-decoration: underline;
      }
      #preview .md-title {
        color: var(--fg);
      }
      #preview h2 {
        font-size: 13px;
        font-weight: 600;
        margin: 14px 0 6px;
        color: var(--fg);
        border-bottom: 1px solid var(--border);
        padding-bottom: 3px;
      }
      #preview h2:first-child {
        margin-top: 0;
      }
      #preview .mv-field {
        color: var(--muted);
        font-size: 11px;
        margin-top: 1px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .actions-bar {
        grid-column: 1 / -1;
        display: flex;
        gap: var(--space-2);
        margin-top: var(--space-1);
      }
      button {
        flex: 1;
        min-height: var(--btn-h);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--field-bg);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      button:hover {
        background: color-mix(in srgb, var(--field-bg) 80%, var(--fg));
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
      button.primary:hover {
        background: color-mix(in srgb, var(--accent) 85%, black);
      }
      #status {
        grid-column: 1 / -1;
        min-height: 16px;
        color: var(--muted);
        word-break: break-word;
        margin-top: var(--space-1);
      }
      input[type="checkbox"],
      input[type="radio"] {
        accent-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <h1>Tab Info Exporter</h1>
    <div id="count"></div>

     <div class="app">
      <!-- LEFT: Preview column -->
      <div class="preview-col">
        <fieldset>
          <legend id="formatLegend"></legend>
          <div class="format">
             <label class="field"><input type="radio" name="format" value="txt" /> <span id="fmtTxt"></span></label>
             <label class="field"><input type="radio" name="format" value="md" /> <span id="fmtMd"></span></label>
             <label class="field"><input type="radio" name="format" value="csv" checked /> <span id="fmtCsv"></span></label>
             <label class="field"><input type="radio" name="format" value="json" /> <span id="fmtJson"></span></label>
          </div>
        </fieldset>
        <div id="preview"></div>
      </div>

      <!-- RIGHT: Controls column -->
      <div class="controls-col">
        <label>
          <span id="langLabelText"></span>
          <select id="lang"></select>
        </label>

        <label>
          <span id="sortLabelText"></span>
          <select id="sort"></select>
        </label>

        <fieldset>
          <legend id="fieldsLegend"></legend>
          <div id="fields" class="field-grid"></div>
        </fieldset>

        <label class="field">
           <input type="checkbox" id="groupByDomain" /> <span id="groupByDomainLabel"></span>
         </label>
       </div>

      <!-- BOTTOM: Full-width action bar -->
      <div class="actions-bar">
        <button id="copy" class="primary"></button>
        <button id="download"></button>
      </div>

      <div id="status"></div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
