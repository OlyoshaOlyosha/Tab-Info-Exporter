<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Info Exporter</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1c1c1c;
        --muted: #6b6b6b;
        --border: #d8d8d8;
        --accent: #0a84ff;
        --accent-fg: #ffffff;
        --field-bg: #f5f5f5;
        --radius: 8px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --fg: #f2f2f2;
          --muted: #a0a0a0;
          --border: #3a3a3a;
          --accent: #0a84ff;
          --accent-fg: #ffffff;
          --field-bg: #2a2a2a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 300px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        color: var(--fg);
        background: var(--bg);
        padding: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      #count {
        color: var(--muted);
        margin-bottom: 10px;
      }
      label { display: block; }
      select, fieldset, .actions { margin-bottom: 10px; }
      select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--field-bg);
        color: var(--fg);
        font: inherit;
      }
      fieldset {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 10px;
      }
      legend { padding: 0 4px; color: var(--muted); }
      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 10px;
      }
      .field {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 0;
      }
      .format {
        display: flex;
        gap: 14px;
        padding: 2px 0;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      button {
        flex: 1;
        min-height: 36px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--field-bg);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
      #status {
        min-height: 16px;
        color: var(--muted);
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>Tab Info Exporter</h1>
    <div id="count">Вкладок: …</div>

    <label>
      Сортировка
      <select id="sort"></select>
    </label>

    <fieldset>
      <legend>Поля</legend>
      <div id="fields" class="field-grid"></div>
    </fieldset>

    <fieldset>
      <legend>Формат</legend>
      <div class="format">
        <label class="field"><input type="radio" name="format" value="csv" checked /> CSV</label>
        <label class="field"><input type="radio" name="format" value="json" /> JSON</label>
      </div>
    </fieldset>

    <div class="actions">
      <button id="copy" class="primary">Копировать</button>
      <button id="download">Скачать файл</button>
    </div>

    <div id="status"></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
